{% set name = "phylonetworks" %}
{% set version = "1.3.1" %}
{% set min_julia_version = "1.12" %}
{% set sha256 = "695958d282e6eab5ae4ee80adc465fee634d5596ed742b9722f3d44ca2e8ee11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

build:
  number: 0
  skip: True # [osx]

source:
  url: https://github.com/JuliaPhylo/PhyloNetworks.jl/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}
  
requirements:
  build:
    - julia >={{ min_julia_version }}
  host:
    - julia >={{ min_julia_version }}
  run:
    - julia >={{ min_julia_version }}

test:
  commands:
    - julia -v
    - julia -e 'using PhyloNetworks'

about:
  home: https://github.com/JuliaPhylo/PhyloNetworks.jl
  license: MIT
  summary: PhyloNetworks is a Julia package with utilities to to handle phylogenetic trees and networks

extra:
  skip-lints:
    - should_be_noarch_generic